stages:
  - build

variables:
  CI_SERVER_URL: "https://git.evidentbd.com"
  INTERNAL_REGISTRY: "gitlab:5050"
  DOCKER_IMAGE_NAME: $INTERNAL_REGISTRY/$CI_PROJECT_PATH
  # DOCKER_REGISTRY: docker.io
  # DOCKER_USERNAME: evidentbd
  # DOCKER_IMAGE_NAME: evidentbd/mye-frontend
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""
  DOCKER_DRIVER: overlay2

build-and-push:
  stage: build
  image: docker:latest
  services:
    - name: docker:dind
      alias: docker
      variables:
        DOCKER_TLS_CERTDIR: ""
      entrypoint: ["dockerd-entrypoint.sh"]
      command:
        [
          "--host=tcp://0.0.0.0:2375",
          "--host=unix:///var/run/docker.sock",
          "--tls=false",
          "--insecure-registry=gitlab:5050",
        ]
  variables:
    FF_NETWORK_PER_BUILD: "true"
    HEALTHCHECK_TCP_PORT: "2375"
  tags:
    - docker-build
  script:
    - |
      echo "Waiting for Docker daemon..."
      for i in $(seq 1 30); do
        if docker info >/dev/null 2>&1; then
          echo "Docker is ready!"
          break
        fi
        echo "Waiting... ($i/30)"
        sleep 1
      done
    - echo "${CI_REGISTRY_PASSWORD}" | docker login -u "${CI_REGISTRY_USER}" --password-stdin "${INTERNAL_REGISTRY}"
    - docker build -t $DOCKER_IMAGE_NAME:$CI_COMMIT_TAG .
    - docker push $DOCKER_IMAGE_NAME:$CI_COMMIT_TAG
    - echo "Docker image pushed successfully!"
  only:
    - tags
