name: Mye Frontend CI/CD

on:
  pull_request:
    branches: [master]

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-node@v1
        with:
          node-version: "20.10.0"
      - run: npm i -g pnpm
      - run: pnpm install
      - run: pnpm build
